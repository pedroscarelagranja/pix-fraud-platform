services:
  postgres:
    image: postgres:16-alpine
    container_name: pix-postgres
    environment:
      POSTGRES_USER: pix
      POSTGRES_PASSWORD: pix
      POSTGRES_DB: pixfraud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # scripts .sql dentro de infra/ rodam na primeira subida
      - ./infra:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix -d pixfraud"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pix-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka em modo KRaft (sem Zookeeper), nó único para desenvolvimento
  kafka:
    image: apache/kafka:3.8.0
    container_name: pix-kafka
    ports:
      - "29092:29092" # acesso a partir da sua máquina (localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Interface web para ver tópicos e mensagens (ótimo para demo/GIF do README)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pix-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # Engine de risco (FastAPI) em container; porta 8000
  risk-engine:
    build: ./risk-engine
    container_name: pix-risk-engine
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servico de autorizacao (versao Python provisoria): transacoes.pix -> engine -> decisoes.pix
  authorization-worker:
    build: ./authorization-worker
    container_name: pix-authorization-worker
    depends_on:
      kafka:
        condition: service_healthy
      risk-engine:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENGINE_URL: http://risk-engine:8000
    restart: unless-stopped

  # Relatorio de metricas (le decisoes.pix e grava docs/metricas.md):
  #   docker compose run --rm metrics
  metrics:
    build: ./metrics
    container_name: pix-metrics
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./docs:/out
    command: ["python", "report.py", "--out", "/out/metricas.md"]

  # Gerador de transacoes simuladas (nao sobe junto com o resto; chame pelo nome):
  #   docker compose up -d --build tx-generator
  tx-generator:
    build: ./tx-generator
    container_name: pix-tx-generator
    profiles: ["generator"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RATE_PER_SEC: "2"
      FRAUD_RATIO: "0.15"

volumes:
  postgres_data:
  redis_data:
  kafka_data:

# Como usar:
#   docker compose up -d
#   docker compose ps
#   Kafka UI:   http://localhost:8080
#   Postgres:   localhost:5432  (user: pix / senha: pix / db: pixfraud)
#   Redis:      localhost:6379
#   Kafka:      localhost:29092 (de fora do Docker) | kafka:9092 (entre containers)
